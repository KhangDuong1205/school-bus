<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Bus Route Planner{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================
           DESIGN SYSTEM — CSS Custom Properties
           ============================================ */
        :root {
            /* Sidebar */
            --sidebar-width: 248px;
            --sidebar-collapsed-width: 68px;
            --sidebar-bg: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            --sidebar-hover: rgba(255, 255, 255, 0.06);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);

            /* Typography */
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --text-on-dark: #e2e8f0;
            --text-muted-dark: #64748b;

            /* Colors */
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-success: #059669;
            --color-success-light: #ecfdf5;
            --color-warning: #d97706;
            --color-warning-light: #fffbeb;
            --color-danger: #dc2626;
            --color-danger-light: #fef2f2;

            /* Surfaces */
            --surface-page: #f8fafc;
            --surface-card: #ffffff;
            --surface-elevated: #ffffff;
            --border-default: #e2e8f0;
            --border-light: #f1f5f9;

            /* Shadows */
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;

            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--surface-page);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ============================================
           SIDEBAR
           ============================================ */
        .app-sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            color: var(--text-on-dark);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 2000;
            transition: width var(--transition-slow);
            position: relative;
            overflow: hidden;
            box-shadow: 1px 0 0 rgba(0,0,0,0.2);
        }

        .app-sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        /* Header / Logo */
        .sidebar-header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            white-space: nowrap;
            transition: padding var(--transition-slow);
        }

        .app-sidebar.collapsed .sidebar-header {
            padding: 0;
            justify-content: center;
        }

        .app-logo {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: opacity var(--transition-base);
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        .app-sidebar.collapsed .app-logo {
            display: none;
        }

        /* Toggle Button */
        .header-toggle-btn {
            margin-left: auto;
            background: transparent;
            border: none;
            color: var(--text-muted-dark);
            cursor: pointer;
            font-size: 1.1rem;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-base);
            flex-shrink: 0;
        }

        .header-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .app-sidebar.collapsed .header-toggle-btn {
            margin-left: 0;
            width: 100%;
            border-radius: 0;
        }

        .app-sidebar.collapsed .header-toggle-btn:hover {
            background: var(--sidebar-hover);
        }

        /* Sidebar Navigation */
        .sidebar-nav {
            flex: 1;
            padding: 12px 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .nav-category {
            padding: 0 20px;
            margin-top: 24px;
            margin-bottom: 6px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted-dark);
            font-weight: 600;
            white-space: nowrap;
            transition: opacity var(--transition-base);
        }

        .nav-category:first-child {
            margin-top: 8px;
        }

        .app-sidebar.collapsed .nav-category {
            opacity: 0;
            visibility: hidden;
            height: 0;
            margin: 0;
            padding: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 20px;
            margin: 2px 8px;
            border-radius: var(--radius-md);
            color: var(--text-muted-dark);
            text-decoration: none;
            transition: all var(--transition-base);
            white-space: nowrap;
            overflow: hidden;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .nav-item:hover {
            background: var(--sidebar-hover);
            color: #e2e8f0;
            transform: translateX(2px);
        }

        .nav-item.active {
            background: var(--accent-glow);
            color: var(--accent-color);
            border-right: none;
            font-weight: 600;
            box-shadow: inset 3px 0 0 var(--accent-color);
        }

        .nav-icon {
            min-width: 22px;
            text-align: center;
            font-size: 1rem;
            margin-right: 12px;
            display: flex;
            justify-content: center;
        }

        .app-sidebar.collapsed .nav-item {
            justify-content: center;
            padding: 0;
            margin: 2px 6px;
            border-radius: var(--radius-sm);
        }

        .app-sidebar.collapsed .nav-item.active {
            box-shadow: none;
            border-right: none;
        }

        .app-sidebar.collapsed .nav-icon {
            margin-right: 0;
        }

        .app-sidebar.collapsed .nav-item span:last-child {
            opacity: 0;
            width: 0;
            display: none;
        }

        /* Footer */
        .sidebar-footer {
            padding: 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.7rem;
            color: var(--text-muted-dark);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            letter-spacing: 0.02em;
        }

        .sidebar-footer span {
            background: rgba(255,255,255,0.06);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-weight: 500;
        }

        .app-sidebar.collapsed .sidebar-footer {
            display: none;
        }

        /* ============================================
           SCHOOL LOCATION BANNER
           ============================================ */
        .school-banner {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            flex-shrink: 0;
        }

        .app-sidebar.collapsed .school-banner {
            display: none;
        }

        .school-banner-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            cursor: pointer;
            user-select: none;
            transition: background var(--transition-base);
        }

        .school-banner-header:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .school-banner-header .banner-icon {
            font-size: 0.95rem;
        }

        .school-banner-header .banner-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
            color: var(--text-muted-dark);
            flex: 1;
        }

        .school-banner-header .banner-chevron {
            font-size: 0.6rem;
            color: var(--text-muted-dark);
            transition: transform var(--transition-slow);
        }

        .school-banner.collapsed .banner-chevron {
            transform: rotate(-90deg);
        }

        .school-banner-body {
            padding: 0 12px 12px 12px;
            transition: max-height var(--transition-slow), opacity var(--transition-base), padding var(--transition-slow);
            max-height: 120px;
            opacity: 1;
            overflow: hidden;
        }

        .school-banner.collapsed .school-banner-body {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        .school-banner-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(52, 211, 153, 0.06));
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            text-decoration: none;
            display: block;
            transition: all var(--transition-base);
        }

        .school-banner-card:hover {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(52, 211, 153, 0.12));
            transform: translateY(-1px);
        }

        .school-banner-card.not-set {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(245, 158, 11, 0.06));
            border-color: rgba(251, 191, 36, 0.25);
        }

        .school-banner-card.not-set:hover {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.12));
        }

        .school-banner-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: #a7f3d0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .school-banner-card.not-set .school-banner-name {
            color: #fcd34d;
        }

        .school-banner-address {
            font-size: 0.68rem;
            color: var(--text-muted-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* ============================================
           MAIN CONTENT AREA
           ============================================ */
        .app-main {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--surface-card);
            display: flex;
            flex-direction: column;
        }

        /* Utility classes */
        .dark-theme-content {
            background: #0f172a;
            color: #e2e8f0;
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body>
    <div class="app-layout">
        <!-- FIXED SIDEBAR -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <a href="/" class="app-logo">
                    <span class="nav-icon"><i class="fas fa-route"></i></span>
                    <span>RouteOptimise</span>
                </a>
                <button class="header-toggle-btn" onclick="toggleAppSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-category">Main</div>
                <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-map-marked-alt"></i></span>
                    <span>Route Planning</span>
                </a>
                <a href="/export-data" class="nav-item {% if request.path == '/export-data' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-table"></i></span>
                    <span>Results Table</span>
                </a>

                <div class="nav-category">Fleet Management</div>
                <a href="/vehicle-types" class="nav-item {% if active_page == 'vehicle_types' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-shuttle-van"></i></span>
                    <span>Vehicle Types</span>
                </a>
                <a href="/vehicles" class="nav-item {% if active_page == 'vehicles' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-bus"></i></span>
                    <span>Vehicles (Fleet)</span>
                </a>
                <a href="/students" class="nav-item {% if active_page == 'students' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-user-graduate"></i></span>
                    <span>Students</span>
                </a>

                <div class="nav-category">Settings</div>
                <a href="/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-cog"></i></span>
                    <span>Settings</span>
                </a>
            </nav>

            <!-- School Location Banner (collapsible) -->
            <div class="school-banner" id="schoolBanner">
                <div class="school-banner-header" onclick="toggleSchoolBanner()">
                    <span class="banner-icon">🏫</span>
                    <span class="banner-label">Active School</span>
                    <i class="fas fa-chevron-down banner-chevron"></i>
                </div>
                <div class="school-banner-body">
                    <a href="/settings" class="school-banner-card not-set" id="schoolBannerCard">
                        <div class="school-banner-name" id="schoolBannerName">No school set</div>
                        <div class="school-banner-address" id="schoolBannerAddress">Click to set in Settings</div>
                    </a>
                </div>
            </div>

            <div class="sidebar-footer">
                <span>v1.0.0 Alpha</span>
            </div>
        </aside>

        <!-- DYNAMIC CONTENT -->
        <main class="app-main {% block main_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        function toggleAppSidebar() {
            const sidebar = document.getElementById('appSidebar');
            sidebar.classList.toggle('collapsed');
        }

        function toggleSchoolBanner() {
            const banner = document.getElementById('schoolBanner');
            banner.classList.toggle('collapsed');
            localStorage.setItem('schoolBannerCollapsed', banner.classList.contains('collapsed'));
        }

        // Load school info into sidebar banner on every page
        document.addEventListener('DOMContentLoaded', async () => {
            if (localStorage.getItem('schoolBannerCollapsed') === 'true') {
                document.getElementById('schoolBanner').classList.add('collapsed');
            }

            try {
                const res = await fetch('/api/school');
                const school = await res.json();
                const card = document.getElementById('schoolBannerCard');
                const nameEl = document.getElementById('schoolBannerName');
                const addrEl = document.getElementById('schoolBannerAddress');

                if (school && school.latitude && (school.latitude !== 0 || school.longitude !== 0)) {
                    card.classList.remove('not-set');
                    nameEl.textContent = school.name || 'School';
                    addrEl.textContent = school.address || `${school.latitude.toFixed(4)}, ${school.longitude.toFixed(4)}`;
                }
            } catch (e) {
                console.error('Failed to load school banner:', e);
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
