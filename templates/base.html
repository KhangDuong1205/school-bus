<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Bus Route Planner{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sidebar-width: 240px;
            --sidebar-collapsed-width: 64px;
            --sidebar-bg: #1a1a2e;
            --sidebar-hover: #16213e;
            --accent-color: #00d9ff;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            color: #334155;
            overflow: hidden;
            /* Prevent body scroll, handle in main */
        }

        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* === MAIN SIDEBAR === */
        .app-sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #0f172a;
            flex-shrink: 0;
            z-index: 2000;
            transition: width 0.3s ease;
            position: relative;
            overflow: hidden;
            /* Hide overflowing text during transition */
        }

        .app-sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        /* Header / Logo */
        .sidebar-header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            white-space: nowrap;
            transition: padding 0.3s ease;
        }

        .app-sidebar.collapsed .sidebar-header {
            padding: 0;
            justify-content: center;
        }

        .app-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: opacity 0.2s, width 0.2s;
            overflow: hidden;
        }

        .app-sidebar.collapsed .app-logo {
            display: none;
            /* Hide logo completely when collapsed to show only toggle */
        }

        /* Toggle Button */
        .header-toggle-btn {
            margin-left: auto;
            /* Push to right when open */
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .header-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .app-sidebar.collapsed .header-toggle-btn {
            margin-left: 0;
            width: 100%;
            /* Fill width or remain centered */
            border-radius: 0;
        }

        .app-sidebar.collapsed .header-toggle-btn:hover {
            background: var(--sidebar-hover);
        }

        /* Sidebar Navigation */
        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .nav-category {
            padding: 0 20px;
            margin-top: 24px;
            margin-bottom: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        .app-sidebar.collapsed .nav-category {
            opacity: 0;
            visibility: hidden;
            height: 0;
            margin: 0;
            padding: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            height: 48px;
            padding: 0 20px;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
        }

        .nav-item:hover {
            background: var(--sidebar-hover);
            color: #fff;
        }

        .nav-item.active {
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent-color);
            border-right: 3px solid var(--accent-color);
        }

        .nav-icon {
            min-width: 24px;
            /* Fixed width for icon */
            text-align: center;
            font-size: 1.1rem;
            margin-right: 12px;
            display: flex;
            justify-content: center;
        }

        .app-sidebar.collapsed .nav-item {
            justify-content: center;
            /* Center items */
            padding: 0;
        }

        .app-sidebar.collapsed .nav-icon {
            margin-right: 0;
        }

        .app-sidebar.collapsed .nav-item span:last-child {
            opacity: 0;
            width: 0;
            display: none;
        }

        /* Footer */
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .app-sidebar.collapsed .sidebar-footer {
            display: none;
        }

        /* === SCHOOL LOCATION BANNER === */
        .school-banner {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            flex-shrink: 0;
        }

        .app-sidebar.collapsed .school-banner {
            display: none;
        }

        .school-banner-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .school-banner-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .school-banner-header .banner-icon {
            font-size: 1rem;
        }

        .school-banner-header .banner-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
            color: var(--text-muted);
            flex: 1;
        }

        .school-banner-header .banner-chevron {
            font-size: 0.65rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .school-banner.collapsed .banner-chevron {
            transform: rotate(-90deg);
        }

        .school-banner-body {
            padding: 0 14px 12px 14px;
            transition: max-height 0.3s ease, opacity 0.2s ease, padding 0.3s ease;
            max-height: 120px;
            opacity: 1;
            overflow: hidden;
        }

        .school-banner.collapsed .school-banner-body {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        .school-banner-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(52, 211, 153, 0.08));
            border: 1px solid rgba(52, 211, 153, 0.25);
            border-radius: 8px;
            padding: 10px 12px;
            text-decoration: none;
            display: block;
            transition: all 0.2s;
        }

        .school-banner-card:hover {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(52, 211, 153, 0.15));
            transform: translateY(-1px);
        }

        .school-banner-card.not-set {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.08));
            border-color: rgba(251, 191, 36, 0.3);
        }

        .school-banner-card.not-set:hover {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(245, 158, 11, 0.15));
        }

        .school-banner-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: #a7f3d0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .school-banner-card.not-set .school-banner-name {
            color: #fcd34d;
        }

        .school-banner-address {
            font-size: 0.7rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* === MAIN CONTENT AREA === */
        .app-main {
            flex: 1;
            position: relative;
            overflow: hidden;
            /* Scroll handled by children */
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        /* Utility classes */
        .dark-theme-content {
            background: #0f172a;
            color: #e2e8f0;
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body>
    <div class="app-layout">
        <!-- FIXED SIDEBAR -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <a href="/" class="app-logo">
                    <span class="nav-icon"><i class="fas fa-route"></i></span>
                    <span>Optimise</span>
                </a>
                <button class="header-toggle-btn" onclick="toggleAppSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-category">Main</div>
                <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-map-marked-alt"></i></span>
                    <span>Route Planning</span>
                </a>
                <a href="/export-data" class="nav-item {% if request.path == '/export-data' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-table"></i></span>
                    <span>Results Table</span>
                </a>

                <div class="nav-category">Fleet Management</div>
                <a href="/vehicle-types" class="nav-item {% if active_page == 'vehicle_types' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-shuttle-van"></i></span>
                    <span>Vehicle Types</span>
                </a>
                <a href="/vehicles" class="nav-item {% if active_page == 'vehicles' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-bus"></i></span>
                    <span>Vehicles (Fleet)</span>
                </a>
                <a href="/students" class="nav-item {% if active_page == 'students' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-user-graduate"></i></span>
                    <span>Students</span>
                </a>

                <div class="nav-category">Settings</div>
                <a href="/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-cog"></i></span>
                    <span>Settings</span>
                </a>
            </nav>

            <!-- School Location Banner (collapsible) -->
            <div class="school-banner" id="schoolBanner">
                <div class="school-banner-header" onclick="toggleSchoolBanner()">
                    <span class="banner-icon">🏫</span>
                    <span class="banner-label">Active School</span>
                    <i class="fas fa-chevron-down banner-chevron"></i>
                </div>
                <div class="school-banner-body">
                    <a href="/settings" class="school-banner-card not-set" id="schoolBannerCard">
                        <div class="school-banner-name" id="schoolBannerName">No school set</div>
                        <div class="school-banner-address" id="schoolBannerAddress">Click to set in Settings</div>
                    </a>
                </div>
            </div>

            <div class="sidebar-footer">
                v1.0.0 Alpha
            </div>
        </aside>

        <!-- DYNAMIC CONTENT -->
        <main class="app-main {% block main_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        function toggleAppSidebar() {
            const sidebar = document.getElementById('appSidebar');
            sidebar.classList.toggle('collapsed');
        }

        function toggleSchoolBanner() {
            const banner = document.getElementById('schoolBanner');
            banner.classList.toggle('collapsed');
            // Remember state
            localStorage.setItem('schoolBannerCollapsed', banner.classList.contains('collapsed'));
        }

        // Load school info into sidebar banner on every page
        document.addEventListener('DOMContentLoaded', async () => {
            // Restore collapsed state
            if (localStorage.getItem('schoolBannerCollapsed') === 'true') {
                document.getElementById('schoolBanner').classList.add('collapsed');
            }

            try {
                const res = await fetch('/api/school');
                const school = await res.json();
                const card = document.getElementById('schoolBannerCard');
                const nameEl = document.getElementById('schoolBannerName');
                const addrEl = document.getElementById('schoolBannerAddress');

                if (school && school.latitude && (school.latitude !== 0 || school.longitude !== 0)) {
                    card.classList.remove('not-set');
                    nameEl.textContent = school.name || 'School';
                    addrEl.textContent = school.address || `${school.latitude.toFixed(4)}, ${school.longitude.toFixed(4)}`;
                }
            } catch (e) {
                console.error('Failed to load school banner:', e);
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
