<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Bus Route Planner{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sidebar-width: 240px;
            --sidebar-collapsed-width: 64px;
            --sidebar-bg: #1a1a2e;
            --sidebar-hover: #16213e;
            --accent-color: #00d9ff;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            color: #334155;
            overflow: hidden;
            /* Prevent body scroll, handle in main */
        }

        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* === MAIN SIDEBAR === */
        .app-sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #0f172a;
            flex-shrink: 0;
            z-index: 2000;
            transition: width 0.3s ease;
            position: relative;
            overflow: hidden;
            /* Hide overflowing text during transition */
        }

        .app-sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        /* Header / Logo */
        .sidebar-header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            white-space: nowrap;
            transition: padding 0.3s ease;
        }

        .app-sidebar.collapsed .sidebar-header {
            padding: 0;
            justify-content: center;
        }

        .app-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: opacity 0.2s, width 0.2s;
            overflow: hidden;
        }

        .app-sidebar.collapsed .app-logo {
            display: none;
            /* Hide logo completely when collapsed to show only toggle */
        }

        /* Toggle Button */
        .header-toggle-btn {
            margin-left: auto;
            /* Push to right when open */
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .header-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .app-sidebar.collapsed .header-toggle-btn {
            margin-left: 0;
            width: 100%;
            /* Fill width or remain centered */
            border-radius: 0;
        }

        .app-sidebar.collapsed .header-toggle-btn:hover {
            background: var(--sidebar-hover);
        }

        /* Sidebar Navigation */
        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .nav-category {
            padding: 0 20px;
            margin-top: 24px;
            margin-bottom: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        .app-sidebar.collapsed .nav-category {
            opacity: 0;
            visibility: hidden;
            height: 0;
            margin: 0;
            padding: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            height: 48px;
            padding: 0 20px;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
        }

        .nav-item:hover {
            background: var(--sidebar-hover);
            color: #fff;
        }

        .nav-item.active {
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent-color);
            border-right: 3px solid var(--accent-color);
        }

        .nav-icon {
            min-width: 24px;
            /* Fixed width for icon */
            text-align: center;
            font-size: 1.1rem;
            margin-right: 12px;
            display: flex;
            justify-content: center;
        }

        .app-sidebar.collapsed .nav-item {
            justify-content: center;
            /* Center items */
            padding: 0;
        }

        .app-sidebar.collapsed .nav-icon {
            margin-right: 0;
        }

        .app-sidebar.collapsed .nav-item span:last-child {
            opacity: 0;
            width: 0;
            display: none;
        }

        /* Footer */
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .app-sidebar.collapsed .sidebar-footer {
            display: none;
        }

        /* === MAIN CONTENT AREA === */
        .app-main {
            flex: 1;
            position: relative;
            overflow: hidden;
            /* Scroll handled by children */
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        /* Utility classes */
        .dark-theme-content {
            background: #0f172a;
            color: #e2e8f0;
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body>
    <div class="app-layout">
        <!-- FIXED SIDEBAR -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <a href="/" class="app-logo">
                    <span class="nav-icon"><i class="fas fa-route"></i></span>
                    <span>Optimise</span>
                </a>
                <button class="header-toggle-btn" onclick="toggleAppSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-category">Main</div>
                <a href="/" class="nav-item {% if active_page == 'planning' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-map-marked-alt"></i></span>
                    <span>Route Planning</span>
                </a>

                <div class="nav-category">Fleet Management</div>
                <a href="/vehicle-types" class="nav-item {% if active_page == 'vehicle_types' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-shuttle-van"></i></span>
                    <span>Vehicle Types</span>
                </a>
                <a href="/vehicles" class="nav-item {% if active_page == 'vehicles' %}active{% endif %}">
                    <span class="nav-icon"><i class="fas fa-bus"></i></span>
                    <span>Vehicles (Fleet)</span>
                </a>

                <div class="nav-category">Settings</div>
                <!-- Future link -->
                <a href="#" class="nav-item" style="opacity: 0.5; cursor: not-allowed;">
                    <span class="nav-icon"><i class="fas fa-cog"></i></span>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                v1.0.0 Alpha
            </div>
        </aside>

        <!-- DYNAMIC CONTENT -->
        <main class="app-main {% block main_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        function toggleAppSidebar() {
            const sidebar = document.getElementById('appSidebar');
            sidebar.classList.toggle('collapsed');
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
